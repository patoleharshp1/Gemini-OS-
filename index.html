<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Suite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
  h1 { margin-bottom: 20px; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.3); }
  
  .game-container { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; max-width: 1200px; width: 100%; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; min-width: 320px; }
  .card h2 { margin-bottom: 15px; color: #e2e8f0; font-size: 1.25rem; }
  
  .controls-bar { display: flex; gap: 10px; width: 100%; margin-bottom: 15px; justify-content: space-between; align-items: center; }
  button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
  button:hover { background: #2563eb; }
  select { background: #334155; color: white; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  
  .score-board { font-size: 0.9rem; color: #94a3b8; display: flex; gap: 15px; width: 100%; justify-content: center; margin-bottom: 10px; }
  .score-board span { color: #38bdf8; font-weight: bold; }
  
  /* Tic Tac Toe Grid */
  .ttt-board { display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 8px; margin-top: 10px; }
  .ttt-cell { background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; user-select: none; transition: background 0.2s; }
  .ttt-cell:hover { background: #475569; }
  .ttt-cell.win { background: #10b981; color: white; }
  .ttt-cell.X { color: #f43f5e; }
  .ttt-cell.O { color: #38bdf8; }
  
  /* Canvas Games */
  canvas { background: #020617; border-radius: 8px; border: 2px solid #334155; }
  
  /* Mobile D-Pad for Snake */
  .d-pad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 40px); gap: 5px; margin-top: 10px; }
  .d-pad button { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; background: #334155; }
  .d-pad button:hover { background: #475569; }
</style>
</head>
<body>

<h1>Arcade Suite</h1>

<div class="game-container">

  <!-- TIC TAC TOE -->
  <div class="card">
    <h2>Tic Tac Toe</h2>
    <div class="controls-bar">
      <select id="ttt-mode" onchange="resetTTT()">
        <option value="pvp">2 Player (Local)</option>
        <option value="ai">vs AI (Minimax)</option>
      </select>
      <button onclick="resetTTT()">Restart</button>
    </div>
    <div class="score-board">
      <div>X Wins: <span id="ttt-x-score">0</span></div>
      <div>O Wins: <span id="ttt-o-score">0</span></div>
      <div>Ties: <span id="ttt-ties">0</span></div>
    </div>
    <div class="ttt-board" id="ttt-board"></div>
  </div>

  <!-- SNAKE -->
  <div class="card">
    <h2>Snake</h2>
    <div class="controls-bar">
      <button id="snake-play-btn" onclick="toggleSnake()">Play</button>
      <button onclick="initSnake()">Restart</button>
    </div>
    <div class="score-board">
      <div>Score: <span id="snake-score">0</span></div>
      <div>Best: <span id="snake-best">0</span></div>
    </div>
    <canvas id="snakeCanvas" width="280" height="280"></canvas>
    <div class="d-pad">
      <div></div><button onclick="changeSnakeDir('UP')">▲</button><div></div>
      <button onclick="changeSnakeDir('LEFT')">◄</button><button onclick="changeSnakeDir('DOWN')">▼</button><button onclick="changeSnakeDir('RIGHT')">►</button>
    </div>
  </div>

  <!-- FLAPPY BIRD -->
  <div class="card">
    <h2>Flappy Bird</h2>
    <div class="controls-bar">
      <select id="flappy-theme" onchange="drawFlappy()">
        <option value="day">Day Mode</option>
        <option value="night">Night Mode</option>
      </select>
      <button onclick="resetFlappy()">Restart</button>
    </div>
    <div class="score-board">
      <div>Score: <span id="flappy-score">0</span></div>
      <div>Best: <span id="flappy-best">0</span></div>
    </div>
    <canvas id="flappyCanvas" width="280" height="320"></canvas>
  </div>

</div>

<script>
// --- AUDIO SYNTHESIZER ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;
  if (type === 'tap') {
    osc.frequency.setValueAtTime(400, now);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } else if (type === 'eat') {
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'jump') {
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'over') {
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  }
}

// --- TIC TAC TOE LOGIC ---
let tttState = Array(9).fill(null);
let tttTurn = 'X';
let tttActive = true;
let tttScores = JSON.parse(localStorage.getItem('tttScores')) || { x: 0, o: 0, ties: 0 };

function updateTTTScores() {
  document.getElementById('ttt-x-score').innerText = tttScores.x;
  document.getElementById('ttt-o-score').innerText = tttScores.o;
  document.getElementById('ttt-ties').innerText = tttScores.ties;
  localStorage.setItem('tttScores', JSON.stringify(tttScores));
}

function renderTTT() {
  const board = document.getElementById('ttt-board');
  board.innerHTML = '';
  tttState.forEach((val, idx) => {
    const cell = document.createElement('div');
    cell.className = `ttt-cell ${val || ''}`;
    cell.innerText = val || '';
    cell.onclick = () => handleTTTClick(idx);
    board.appendChild(cell);
  });
}

function handleTTTClick(idx) {
  if (!tttState[idx] && tttActive) {
    makeTTTMove(idx, tttTurn);
    playSound('tap');
    if (tttActive && document.getElementById('ttt-mode').value === 'ai' && tttTurn === 'O') {
      setTimeout(makeAIMove, 250);
    }
  }
}

function makeTTTMove(idx, player) {
  tttState[idx] = player;
  const winComb = checkTTTWin(tttState);
  if (winComb) {
    tttActive = false;
    renderTTT();
    winComb.forEach(i => document.querySelectorAll('.ttt-cell')[i].classList.add('win'));
    tttScores[player.toLowerCase()]++;
    updateTTTScores();
    playSound('eat');
  } else if (tttState.every(c => c !== null)) {
    tttActive = false;
    tttScores.ties++;
    updateTTTScores();
    renderTTT();
    playSound('over');
  } else {
    tttTurn = player === 'X' ? 'O' : 'X';
    renderTTT();
  }
}

function checkTTTWin(board) {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for (let l of lines) {
    if (board[l[0]] && board[l[0]] === board[l[1]] && board[l[0]] === board[l[2]]) return l;
  }
  return null;
}

function makeAIMove() {
  let bestScore = -Infinity;
  let move;
  for (let i = 0; i < 9; i++) {
    if (!tttState[i]) {
      tttState[i] = 'O';
      let score = minimax(tttState, 0, false);
      tttState[i] = null;
      if (score > bestScore) { bestScore = score; move = i; }
    }
  }
  if (move !== undefined) makeTTTMove(move, 'O');
}

function minimax(board, depth, isMaximizing) {
  const win = checkTTTWin(board);
  if (win) return board[win[0]] === 'O' ? 10 - depth : depth - 10;
  if (board.every(c => c !== null)) return 0;
  
  if (isMaximizing) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'O';
        best = Math.max(best, minimax(board, depth + 1, false));
        board[i] = null;
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'X';
        best = Math.min(best, minimax(board, depth + 1, true));
        board[i] = null;
      }
    }
    return best;
  }
}

function resetTTT() {
  tttState = Array(9).fill(null);
  tttTurn = 'X';
  tttActive = true;
  renderTTT();
}

// --- SNAKE LOGIC ---
const snakeCv = document.getElementById('snakeCanvas');
const snakeCtx = snakeCv.getContext('2d');
const grid = 14;
let snake, dir, food, snakeScore, snakeBest, snakeLoop, snakeRunning, speed;

function initSnake() {
  clearInterval(snakeLoop);
  snake = [{x: 5, y: 5}];
  dir = 'RIGHT';
  snakeScore = 0;
  speed = 120;
  snakeBest = localStorage.getItem('snakeBest') || 0;
  document.getElementById('snake-score').innerText = snakeScore;
  document.getElementById('snake-best').innerText = snakeBest;
  spawnFood();
  snakeRunning = false;
  document.getElementById('snake-play-btn').innerText = 'Play';
  drawSnake();
}

function toggleSnake() {
  if (snakeRunning) {
    clearInterval(snakeLoop);
    snakeRunning = false;
    document.getElementById('snake-play-btn').innerText = 'Play';
  } else {
    snakeRunning = true;
    document.getElementById('snake-play-btn').innerText = 'Pause';
    snakeLoop = setInterval(stepSnake, speed);
  }
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * (snakeCv.width / grid)),
    y: Math.floor(Math.random() * (snakeCv.height / grid)),
    special: Math.random() < 0.2
  };
}

function changeSnakeDir(newDir) {
  if (newDir === 'LEFT' && dir !== 'RIGHT') dir = 'LEFT';
  if (newDir === 'UP' && dir !== 'DOWN') dir = 'UP';
  if (newDir === 'RIGHT' && dir !== 'LEFT') dir = 'RIGHT';
  if (newDir === 'DOWN' && dir !== 'UP') dir = 'DOWN';
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') changeSnakeDir('LEFT');
  if (e.key === 'ArrowUp' || e.key === 'w') changeSnakeDir('UP');
  if (e.key === 'ArrowRight' || e.key === 'd') changeSnakeDir('RIGHT');
  if (e.key === 'ArrowDown' || e.key === 's') changeSnakeDir('DOWN');
});

function stepSnake() {
  let head = { ...snake[0] };
  if (dir === 'LEFT') head.x--;
  if (dir === 'UP') head.y--;
  if (dir === 'RIGHT') head.x++;
  if (dir === 'DOWN') head.y++;
  
  if (head.x < 0 || head.x >= snakeCv.width/grid || head.y < 0 || head.y >= snakeCv.height/grid || snake.some(s => s.x === head.x && s.y === head.y)) {
    playSound('over');
    initSnake();
    return;
  }
  
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    playSound('eat');
    snakeScore += food.special ? 30 : 10;
    if (snakeScore > snakeBest) {
      snakeBest = snakeScore;
      localStorage.setItem('snakeBest', snakeBest);
    }
    document.getElementById('snake-score').innerText = snakeScore;
    document.getElementById('snake-best').innerText = snakeBest;
    spawnFood();
    if (speed > 50) { clearInterval(snakeLoop); speed -= 2; snakeLoop = setInterval(stepSnake, speed); }
  } else {
    snake.pop();
  }
  drawSnake();
}

function drawSnake() {
  snakeCtx.fillStyle = '#020617';
  snakeCtx.fillRect(0, 0, snakeCv.width, snakeCv.height);
  
  snakeCtx.fillStyle = food.special ? '#f59e0b' : '#ef4444';
  snakeCtx.beginPath();
  snakeCtx.arc(food.x * grid + grid/2, food.y * grid + grid/2, grid/2, 0, Math.PI * 2);
  snakeCtx.fill();
  
  snake.forEach((part, i) => {
    snakeCtx.fillStyle = i === 0 ? '#10b981' : '#34d399';
    snakeCtx.fillRect(part.x * grid, part.y * grid, grid - 1, grid - 1);
  });
}

// --- FLAPPY BIRD LOGIC ---
const flappyCv = document.getElementById('flappyCanvas');
const flappyCtx = flappyCv.getContext('2d');
let bird, pipes, flappyScore, flappyBest, flappyLoop, flappyRunning;

function resetFlappy() {
  cancelAnimationFrame(flappyLoop);
  bird = { x: 40, y: 150, vy: 0, gravity: 0.35, jump: -6 };
  pipes = [];
  flappyScore = 0;
  flappyBest = localStorage.getItem('flappyBest') || 0;
  document.getElementById('flappy-score').innerText = flappyScore;
  document.getElementById('flappy-best').innerText = flappyBest;
  flappyRunning = false;
  drawFlappy();
}

function flap() {
  if (!flappyRunning) {
    flappyRunning = true;
    flappyLoop = requestAnimationFrame(stepFlappy);
  }
  bird.vy = bird.jump;
  playSound('jump');
}

flappyCv.addEventListener('click', flap);

function stepFlappy() {
  bird.vy += bird.gravity;
  bird.y += bird.vy;
  
  if (pipes.length === 0 || pipes[pipes.length - 1].x < flappyCv.width - 140) {
    let gap = 90;
    let top = Math.random() * (flappyCv.height - gap - 60) + 30;
    pipes.push({ x: flappyCv.width, top: top, bottom: top + gap, passed: false });
  }
  
  pipes.forEach(p => {
    p.x -= 2;
    if (!p.passed && p.x < bird.x) {
      p.passed = true;
      flappyScore++;
      playSound('eat');
      if (flappyScore > flappyBest) {
        flappyBest = flappyScore;
        localStorage.setItem('flappyBest', flappyBest);
      }
      document.getElementById('flappy-score').innerText = flappyScore;
      document.getElementById('flappy-best').innerText = flappyBest;
    }
  });
  
  if (pipes.length && pipes[0].x < -40) pipes.shift();
  
  // Collision
  if (bird.y > flappyCv.height - 15 || bird.y < 0 || pipes.some(p => p.x < bird.x + 12 && p.x + 40 > bird.x - 12 && (bird.y - 12 < p.top || bird.y + 12 > p.bottom))) {
    playSound('over');
    resetFlappy();
    return;
  }
  
  drawFlappy();
  flappyLoop = requestAnimationFrame(stepFlappy);
}

function drawFlappy() {
  const theme = document.getElementById('flappy-theme').value;
  flappyCtx.fillStyle = theme === 'night' ? '#0f172a' : '#38bdf8';
  flappyCtx.fillRect(0, 0, flappyCv.width, flappyCv.height);
  
  // Draw Pipes
  flappyCtx.fillStyle = '#22c55e';
  pipes.forEach(p => {
    flappyCtx.fillRect(p.x, 0, 40, p.top);
    flappyCtx.fillRect(p.x, p.bottom, 40, flappyCv.height - p.bottom);
  });
  
  // Draw Bird with rotation
  flappyCtx.save();
  flappyCtx.translate(bird.x, bird.y);
  let rot = Math.min(Math.max(bird.vy * 0.05, -0.5), 0.7);
  flappyCtx.rotate(rot);
  flappyCtx.fillStyle = '#f59e0b';
  flappyCtx.beginPath();
  flappyCtx.arc(0, 0, 12, 0, Math.PI * 2);
  flappyCtx.fill();
  flappyCtx.fillStyle = '#ffffff';
  flappyCtx.fillRect(2, -6, 6, 6);
  flappyCtx.restore();
}

// Initializations
updateTTTScores();
resetTTT();
initSnake();
resetFlappy();
</script>
</body>
</html>
