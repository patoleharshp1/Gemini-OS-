<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web OS Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Desktop Grid & Apps */
    .desktop { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; flex: 1; align-content: flex-start; }
    .app-icon { width: 80px; text-align: center; cursor: pointer; border-radius: 12px; padding: 10px; background: rgba(255, 255, 255, 0.05); transition: 0.2s; }
    .app-icon:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-3px); }
    .app-icon img, .app-icon .icon-placeholder { width: 50px; height: 50px; margin: 0 auto 8px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #333; }

    /* Window Overlay */
    .app-window { display: none; position: absolute; top: 50px; left: 50px; width: 450px; min-height: 380px; background: #16213e; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; flex-direction: column; overflow: hidden; resize: both; }
    .app-window.active { display: flex; }
    .window-header { background: #0f3460; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; cursor: move; }
    .window-title { font-weight: bold; }
    .close-btn { cursor: pointer; color: #ff5f56; font-size: 18px; }
    .window-content { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

    /* Camera App Controls */
    .camera-container { position: relative; width: 100%; height: 260px; background: #000; border-radius: 8px; overflow: hidden; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    .camera-controls { display: flex; justify-content: space-around; margin-top: 10px; }
    .btn { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .btn:hover { opacity: 0.9; }

    /* Video Call App */
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .video-box { position: relative; width: 100%; height: 160px; background: #000; border-radius: 8px; }
    .video-box video { width: 100%; height: 100%; border-radius: 8px; }

    /* Users List App */
    .user-item { padding: 8px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

    /* Tic Tac Toe */
    .ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-width: 200px; margin: 10px auto; }
    .ttt-cell { width: 60px; height: 60px; background: #0f3460; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Desktop Icons -->
  <div class="desktop">
    <div class="app-icon" onclick="openApp('online-users-app')">
      <div class="icon-placeholder" style="background:#4e54c8;">👥</div>
      <span>People</span>
    </div>
    <div class="app-icon" onclick="openApp('camera-app')">
      <div class="icon-placeholder" style="background:#ff416c;">📷</div>
      <span>Camera</span>
    </div>
    <div class="app-icon" onclick="openApp('videocall-app')">
      <div class="icon-placeholder" style="background:#11998e;">📹</div>
      <span>Call</span>
    </div>
    <div class="app-icon" onclick="openApp('games-app')">
      <div class="icon-placeholder" style="background:#f857a6;">🎮</div>
      <span>Games</span>
    </div>
  </div>

  <!-- 1. ONLINE USERS APP -->
  <div id="online-users-app" class="app-window">
    <div class="window-header">
      <span class="window-title">Online People</span>
      <span class="close-btn" onclick="closeApp('online-users-app')">&times;</span>
    </div>
    <div class="window-content">
      <div style="margin-bottom:15px;">
        <label>Set Your Name:</label>
        <input type="text" id="username-input" placeholder="Enter name" style="padding: 6px; border-radius:4px; border:none; margin-left: 5px;">
        <button class="btn" onclick="updateUsername()">Save</button>
      </div>
      <h3>Connected Users:</h3>
      <div id="users-list-container" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- 2. REDMI CAMERA APP -->
  <div id="camera-app" class="app-window">
    <div class="window-header">
      <span class="window-title">Camera</span>
      <span class="close-btn" onclick="closeApp('camera-app')">&times;</span>
    </div>
    <div class="window-content">
      <div class="camera-container">
        <video id="camera-feed" autoplay playsinline></video>
        <canvas id="camera-canvas" style="display:none;"></canvas>
      </div>
      <div class="camera-controls">
        <button class="btn" onclick="switchCamera()">🔄 Switch</button>
        <button class="btn" onclick="takePhoto()">📸 Capture</button>
      </div>
    </div>
  </div>

  <!-- 3. VIDEO CALL APP -->
  <div id="videocall-app" class="app-window">
    <div class="window-header">
      <span class="window-title">Video Call</span>
      <span class="close-btn" onclick="closeApp('videocall-app')">&times;</span>
    </div>
    <div class="window-content">
      <div class="video-grid">
        <div class="video-box">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top: 10px;">
        <input type="text" id="target-id" placeholder="Enter Peer Socket ID" style="flex:1; padding:6px; border-radius:4px; border:none;">
        <button class="btn" onclick="startCall()">Call</button>
      </div>
    </div>
  </div>

  <!-- 4. WEB GAMES APP -->
  <div id="games-app" class="app-window">
    <div class="window-header">
      <span class="window-title">Games Center</span>
      <span class="close-btn" onclick="closeApp('games-app')">&times;</span>
    </div>
    <div class="window-content">
      <h3>Tic-Tac-Toe</h3>
      <div class="ttt-board" id="ttt-board"></div>
      <button class="btn" style="margin-top:10px;" onclick="resetTTT()">Reset Game</button>
    </div>
  </div>

  <script>
    const socket = io();

    // App Management
    function openApp(id) {
      document.getElementById(id).classList.add('active');
      if (id === 'camera-app') startCamera();
      if (id === 'videocall-app') initLocalVideo();
    }
    function closeApp(id) {
      document.getElementById(id).classList.remove('active');
      if (id === 'camera-app' && cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
    }

    // --- 1. ONLINE PEOPLE APP ---
    function updateUsername() {
      const name = document.getElementById('username-input').value;
      if (name) socket.emit('set-username', name);
    }

    socket.on('update-user-list', (users) => {
      const container = document.getElementById('users-list-container');
      container.innerHTML = '';
      for (let id in users) {
        const isSelf = id === socket.id;
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <span>${users[id].username} ${isSelf ? '<b>(You)</b>' : ''}</span>
          <small style="opacity:0.6">${id}</small>
        `;
        container.appendChild(div);
      }
    });

    // --- 2. SWITCHABLE CAMERA WITH UNIQUE FILE NAME DOWNLOAD ---
    let cameraStream = null;
    let currentFacingMode = 'user'; // 'user' (front) or 'environment' (back)

    async function startCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode }
        });
        document.getElementById('camera-feed').srcObject = cameraStream;
      } catch (err) {
        alert('Could not access camera: ' + err.message);
      }
    }

    function switchCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function takePhoto() {
      const video = document.getElementById('camera-feed');
      const canvas = document.getElementById('camera-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Create unique timestamped name
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const fileName = `IMG_Redmi_${timestamp}.png`;

      // Trigger download
      const link = document.createElement('a');
      link.download = fileName;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // --- 3. VIDEO CALL APP (WebRTC Fix) ---
    let localStream = null;
    let peerConnection = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function initLocalVideo() {
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById('localVideo').srcObject = localStream;
        } catch (err) {
          console.error("Local media error:", err);
        }
      }
    }

    function createPeerConnection(targetSocketId) {
      peerConnection = new RTCPeerConnection(rtcConfig);

      // Add local tracks to peer
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      // Handle incoming remote track stream
      peerConnection.ontrack = (event) => {
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo.srcObject !== event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { to: targetSocketId, candidate: event.candidate });
        }
      };
    }

    async function startCall() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert('Enter target Socket ID');

      createPeerConnection(targetId);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.emit('call-user', { userToCall: targetId, signalData: offer });
    }

    socket.on('incoming-call', async (data) => {
      createPeerConnection(data.from);
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
      
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('answer-call', { to: data.from, signal: answer });
    });

    socket.on('call-accepted', async (signal) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    // --- 4. TIC TAC TOE APP ---
    let boardState = Array(9).fill(null);
    let currentPlayer = 'X';

    function initTTT() {
      const board = document.getElementById('ttt-board');
      board.innerHTML = '';
      boardState.forEach((cell, i) => {
        const div = document.createElement('div');
        div.className = 'ttt-cell';
        div.innerText = cell || '';
        div.onclick = () => makeTTTMove(i);
        board.appendChild(div);
      });
    }

    function makeTTTMove(i) {
      if (!boardState[i]) {
        boardState[i] = currentPlayer;
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        initTTT();
      }
    }

    function resetTTT() {
      boardState = Array(9).fill(null);
      currentPlayer = 'X';
      initTTT();
    }
    initTTT();
  </script>
</body>
</html>
