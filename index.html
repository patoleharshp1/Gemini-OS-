<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  // Point directly to your live Render server URL
  const socket = io("https://gemini-os.onrender.com");

  const chatBox = document.getElementById('chat-box');
  const messageInput = document.getElementById('messageInput');

  // Receive message from server
  socket.on('receive_message', (data) => {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message';
    msgDiv.innerHTML = `<span class="user">${data.user}:</span> ${data.message} <span class="time">${data.timestamp}</span>`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  // Send message to server
  function sendMessage() {
    const text = messageInput.value.trim();
    if (text !== '') {
      // Prompt for a username if you want to distinguish phones
      const userName = localStorage.getItem('username') || 'Phone 1';
      socket.emit('send_message', { user: userName, message: text });
      messageInput.value = '';
    }
  }
</script>
